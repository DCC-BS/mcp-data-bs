[project]
name = "data-bs-mcp"
version = "0.1.0"
description = "MCP server for data.bs.ch open data portal"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.26.0",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.10",
]

[project.scripts]
data-bs-mcp = "main:main"
data-bs-mcp-http = "main:main_http"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel.force-include]
".env.example" = ".env.example"
