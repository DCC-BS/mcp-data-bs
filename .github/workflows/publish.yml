name: Publish Docker Image

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    uses: DCC-BS/ci-workflows/.github/workflows/publish-docker.yml@2bfad28c27c02b4fe13dbadeb2b8ae970b2fae15
    secrets: inherit
    with:
      project_type: "python"
      registry: ghcr.io
      image_name: ghcr.io/${{ github.repository }}
      context: .
      dockerfile: ./Dockerfile
      platforms: linux/amd64
      push: true
